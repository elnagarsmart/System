name: CardMaster Android debug build

concurrency:
  group: cardmaster-android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, android-nfc-reader, desktop/windows-cardmaster, cardmaster-v2-cross-platform]
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        working-directory: android
        run: gradle :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cardmaster-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
